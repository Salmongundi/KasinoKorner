<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Circle K Kasino</title>

  <link href="https://fonts.googleapis.com/css2?family=Permanent+Marker&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">

  <script src="game.js" defer></script>
</head>
<body>
  <canvas id="c"></canvas>

  <div id="panel">
    <div id="balrow">
      <div>
        <div id="bl">REMAINING CUM</div>
        <div id="bal">100</div>
      </div>

      <button id="beg">Beg the cashier to squirt some cum your way</button>
    </div>

    <div class="row">
      <input id="bet" type="number" min="1" value="10" inputmode="numeric">
      <button data-q="25%">25%</button>
      <button data-q="50%">50%</button>
      <button data-q="max">ALL IN</button>
    </div>

    <div class="row">
      <span id="picks"></span>
    </div>

    <div id="msg">Wager some squirts, call Wiener or Bun, then click the hot dog.</div>
  </div>
</body>
</html>
